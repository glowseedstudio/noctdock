name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Spotless check
        run: ./gradlew spotlessCheckAll --no-daemon

      - name: Unit tests
        run: ./gradlew :noctdock-core:test test --no-daemon

      - name: Assemble debug APKs
        run: >
          ./gradlew :noctdock-sender:assembleDebug :noctdock-receiver:assembleDebug
          --no-daemon
